name: Docs

# This repo is private, and the org's plan serves Pages from public repos only.
# So the workflow builds the encrypted site here and pushes the built output,
# and nothing else, to the public repo INTENTIUS/knr-ops-kit-site. Pages serves
# that repo's main branch. The markdown source never leaves this repo.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Build (strict, encrypted) and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install mkdocs-material and the encryption plugin
        run: pip install -r requirements-docs.txt

      # The site repo is public. An empty password would build plain pages, so
      # stop here instead of publishing them.
      - name: Require the docs password
        env:
          DOCS_PASSWORD: ${{ secrets.DOCS_PASSWORD }}
        run: |
          if [ -z "$DOCS_PASSWORD" ]; then
            echo "::error::Set the DOCS_PASSWORD repository secret before publishing."
            exit 1
          fi

      - name: Build with strict checking
        env:
          DOCS_PASSWORD: ${{ secrets.DOCS_PASSWORD }}
        run: mkdocs build --strict

      # A second guard: fail if any page body survived in the clear.
      - name: Confirm the build is encrypted
        run: |
          if grep -rl -e "knr-bootstrap" site --include="*.html" --include="*.json"; then
            echo "::error::Found unencrypted page content in the build."
            exit 1
          fi

      - name: Push the built site to knr-ops-kit-site
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site_deploy
          chmod 600 ~/.ssh/site_deploy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_deploy -o IdentitiesOnly=yes"

          cd site
          touch .nojekyll
          printf '%s\n' "# knr-ops-kit-site" "" \
            "Built, encrypted output of the knr-ops-kit documentation. Generated by CI; do not edit." \
            > README.md
          git init -q -b main
          git config user.name "knr-ops-kit docs"
          git config user.email "docs@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish docs from ${GITHUB_SHA::7}"
          git push --force git@github.com:INTENTIUS/knr-ops-kit-site.git main
